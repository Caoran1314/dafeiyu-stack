<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>她的房间</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a0908;
    color:#e5ddd3;font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #c{display:block;width:100%;height:100%}
  .panel{position:fixed;background:rgba(16,13,11,.86);border:1px solid rgba(255,214,170,.16);
    border-radius:10px}
  #state{left:22px;top:20px;padding:10px 14px;min-width:158px}
  #state b{display:block;font-size:15px;color:#f6ecdf;font-weight:500;letter-spacing:.4px}
  #state span{font:11px/1.6 Consolas,monospace;color:#e8b072}
  #state i{display:block;font-style:normal;font-size:11px;color:#7a6a5c;margin-top:4px}
  #chat{left:22px;bottom:22px;width:336px;max-height:42vh;overflow:hidden;padding:12px 14px}
  #chat .t{font-size:10.5px;color:#7a6a5c;letter-spacing:1px;margin-bottom:8px}
  #chat .row{margin:6px 0;display:flex}
  #chat .row.her{justify-content:flex-end}
  #chat .b{max-width:80%;padding:6px 10px;border-radius:10px;font-size:12.5px;line-height:1.65}
  #chat .you .b{background:rgba(255,255,255,.07);color:#d6c9ba;border-bottom-left-radius:3px}
  #chat .her .b{background:rgba(232,176,114,.2);color:#f7e9d6;border-bottom-right-radius:3px}
  #mood{right:22px;top:20px;padding:10px 14px;width:172px}
  #mood .k{display:flex;justify-content:space-between;font-size:10.5px;color:#7a6a5c;margin:5px 0 2px}
  #mood .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  #mood .bar em{display:block;height:100%;background:#e8b072}
  #tip{right:22px;bottom:22px;padding:8px 12px;font-size:11px;color:#7a6a5c}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0a0908;color:#7a6a5c;font-size:13px;z-index:9}

  #camctl{position:fixed;right:22px;bottom:64px;display:flex;gap:8px;z-index:9}
  #camctl button{
    font:12px/1 -apple-system,"Microsoft YaHei",sans-serif;color:#d8e8f2;
    background:rgba(12,24,34,.72);border:1px solid rgba(90,150,180,.45);
    border-radius:8px;padding:7px 12px;cursor:pointer;letter-spacing:.5px;
    backdrop-filter:blur(6px);transition:.15s}
  #camctl button:hover{background:rgba(24,48,66,.85);border-color:rgba(120,200,230,.7)}
  #camctl button.on{color:#9fe6ff;border-color:rgba(120,220,255,.8);
    box-shadow:0 0 10px rgba(90,200,255,.25)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">正在搭建她的房间…</div>
<div id="state" class="panel"><b id="s-label">—</b><span id="s-clock">--:--</span>
  <i id="s-hint">她的一天</i></div>
<div id="chat" class="panel"><div class="t">最近的对话</div><div id="chat-list"></div></div>
<div id="mood" class="panel">
  <div class="k"><span>活泼</span><span id="m-joy">0.50</span></div>
  <div class="bar"><em id="b-joy" style="width:50%"></em></div>
  <div class="k"><span>平静</span><span id="m-calm">0.50</span></div>
  <div class="bar"><em id="b-calm" style="width:50%;background:#9fd0b0"></em></div>
  <div class="k"><span>压力</span><span id="m-cort">0.20</span></div>
  <div class="bar"><em id="b-cort" style="width:20%;background:#e8a06c"></em></div>
  <div class="k"><span>亲近</span><span id="m-oxy">0.50</span></div>
  <div class="bar"><em id="b-oxy" style="width:50%;background:#c9a6f0"></em></div>
</div>
<div id="tip" class="panel">拖动旋转 · 滚轮缩放</div>
<div id="camctl">
  <button id="btn-all">全景</button>
  <button id="btn-free">跟随中</button>
</div>

<script type="importmap">
{ "imports": { "three": "./three/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './three/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from './three/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from './three/vrm/three-vrm.module.min.js';

/* ============================ 渲染基础 ============================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.6));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeaf2f9);
scene.fog = new THREE.FogExp2(0xeaf2f9, 0.02);

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 60);
camera.position.set(4.2, 2.2, 8.0);

const controls = new OrbitControls(camera, canvas);
controls.target.set(-0.8, 0.85, -1.3);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.8;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minPolarAngle = 0.12;
controls.enablePan = false;

// 调试俯视：访问 index.html?cam=top
const TOPVIEW = new URLSearchParams(location.search).get('cam') === 'top';
if (TOPVIEW) {
  camera.position.set(0, 20, 12);
  controls.target.set(0, 0, 0.4);
}

// 手动转动视角时，暂停自动跟随；20 秒没动或状态切换后恢复
let camAuto = true;
let camHoldAt = 0;
controls.addEventListener('start', () => { camAuto = false; camHoldAt = performance.now(); });
controls.addEventListener('end', () => { syncCamBtn && syncCamBtn(); });
controls.addEventListener('end', () => { camHoldAt = performance.now(); });

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}


/* ============================ 灯光氛围 ============================ */
const moodLights = [];
let glbTvScreen = null;
function addMoodLight(x, y, z, color, intensity, dist) {
  const L = new THREE.PointLight(color, intensity, dist, 2);
  L.position.set(x, y, z);
  scene.add(L);
  moodLights.push(L);
  return L;
}

// 各房间暖光
addMoodLight(2.4, 2.45, 3.2, 0xffd7a8, 6.5, 7.5);    // 客厅
addMoodLight(-4.0, 2.35, 3.6, 0xffcf9e, 5.0, 6.0);   // 主卧
addMoodLight(-3.5, 2.35, -3.2, 0xffd0b0, 4.2, 5.5);  // 电竞房
addMoodLight(3.5, 2.35, -3.2, 0xffe0c0, 4.0, 5.5);   // 猫房
addMoodLight(0.0, 2.20, -4.4, 0xdfe9ff, 3.2, 4.5);   // 卫生间
addMoodLight(0.6, 2.0, -1.6, 0xffd9b0, 2.4, 4.0);    // 玄关

// 电视冷光（会随电视开关变化）
const tvGlowLight = new THREE.PointLight(0x6fc6ff, 0, 6, 2);
tvGlowLight.position.set(2.4, 1.25, 5.2);
scene.add(tvGlowLight);

/* ============================ 程序化贴图 ============================ */
function canvasTex(w, h, draw, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = 4;
  return t;
}

const marbleTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#e6eef5'; g.fillRect(0, 0, w, h);
  const grd = g.createLinearGradient(0, 0, w, h);
  grd.addColorStop(0, 'rgba(255,252,246,.55)');
  grd.addColorStop(.5, 'rgba(230,222,210,.35)');
  grd.addColorStop(1, 'rgba(255,250,242,.5)');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    g.beginPath();
    let x = Math.random() * w, y = Math.random() * h;
    g.moveTo(x, y);
    for (let k = 0; k < 7; k++) {
      x += (Math.random() - .5) * 130; y += (Math.random() - .5) * 130;
      g.lineTo(x, y);
    }
    g.strokeStyle = 'rgba(150,170,195,' + (.05 + Math.random() * .09) + ')';
    g.lineWidth = .6 + Math.random() * 1.6;
    g.stroke();
  }
}, 3);

const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#33281f'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 200; i++) {
    const y = Math.random() * h;
    g.beginPath();
    g.moveTo(0, y);
    g.bezierCurveTo(w * .3, y + (Math.random() - .5) * 12, w * .7, y + (Math.random() - .5) * 12, w, y + (Math.random() - .5) * 8);
    g.strokeStyle = 'rgba(' + (90 + Math.random() * 40) + ',' + (66 + Math.random() * 30) + ',' + (46 + Math.random() * 24) + ',' + (.05 + Math.random() * .13) + ')';
    g.lineWidth = .6 + Math.random() * 2.4;
    g.stroke();
  }
}, 2);

const wallTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#eaf2f9'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) {
    g.fillStyle = 'rgba(' + (180 + Math.random() * 60) + ',' + (170 + Math.random() * 55) + ',' + (155 + Math.random() * 50) + ',' + (Math.random() * .16) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
}, 4);

const clothTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#eae1d1'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = 'rgba(' + (210 + Math.random() * 45) + ',' + (198 + Math.random() * 45) + ',' + (180 + Math.random() * 45) + ',' + (Math.random() * .3) + ')';
    g.fillRect(Math.random() * w, Math.random() * h, 1, 1);
  }
}, 2);

const S = (tex, color, rough, metal) =>
  new THREE.MeshStandardMaterial({ map: tex, color: color === undefined ? 0xffffff : color,
    roughness: rough === undefined ? 0.9 : rough, metalness: metal || 0 });

const M = {
  marble: S(marbleTex, 0xfbfdff, .30, .05),
  wall: S(wallTex, 0xffffff, .95),
  wood: S(woodTex, 0xffffff, .62, .12),
  cloth: S(clothTex, 0xffffff, .96),
  linen: S(clothTex, 0xfdfeff, .97),
  cream: new THREE.MeshStandardMaterial({ color: 0xf2f7fb, roughness: .95 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x2a2a2c, roughness: .38, metalness: .75 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x1b1a19, roughness: .8 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xf2cbb0, roughness: .72 }),
  hair: new THREE.MeshStandardMaterial({ color: 0x42301f, roughness: .82 }),
  dress: new THREE.MeshStandardMaterial({ color: 0xf4ecdc, roughness: .9 }),
  shoe: new THREE.MeshStandardMaterial({ color: 0xe2d2b6, roughness: .5, metalness: .25 })
};

/* ============================ 圆角盒子 ============================ */
function roundedShape(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2);
  s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r);  s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  s.lineTo(-w / 2, -h / 2 + r);s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  return s;
}
function softBox(w, h, d, m, r) {
  r = Math.min(r === undefined ? 0.03 : r, w * .45, h * .45, d * .45);
  const bevel = Math.min(r, d * .4);
  const inner = roundedShape(Math.max(0.01, w - 2 * bevel), Math.max(0.01, h - 2 * bevel),
    Math.max(0.004, r - bevel / 2));
  const geo = new THREE.ExtrudeGeometry(inner, {
    depth: Math.max(0.004, d - 2 * bevel), bevelEnabled: true, bevelSize: bevel,
    bevelThickness: bevel, bevelSegments: 3, curveSegments: 8, steps: 1
  });
  geo.translate(0, 0, -(d - 2 * bevel) / 2);
  geo.computeVertexNormals();
  const o = new THREE.Mesh(geo, m);
  o.castShadow = true; o.receiveShadow = true;
  return o;
}
const put = (obj, x, y, z) => { obj.position.set(x, y, z); return obj; };

/* ============================ 房间 ============================ */
const room = new THREE.Group();
const shell = new THREE.Group();   // 代码生成的墙地，加载 room.glb 后整个隐藏
room.add(shell);
scene.add(room);

const R = 6.0;            // 半边长，房间 12×12
const H = 2.8;            // 层高

const floor = new THREE.Mesh(new THREE.PlaneGeometry(R * 2, R * 2), M.marble);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
shell.add(floor);

const rug = new THREE.Mesh(new THREE.CircleGeometry(1.55, 64), S(clothTex, 0xe9f3fa, 1));
rug.rotation.x = -Math.PI / 2;
rug.position.set(2.4, 0.012, 4.3);
rug.receiveShadow = true;
room.add(rug);

// 四面外墙
shell.add(put(softBox(R * 2, H, 0.16, M.wall, .02), 0, H / 2, -R));
shell.add(put(softBox(R * 2, H, 0.16, M.wall, .02), 0, H / 2, R));
shell.add(put(softBox(0.16, H, R * 2, M.wall, .02), -R, H / 2, 0));
shell.add(put(softBox(0.16, H, R * 2, M.wall, .02), R, H / 2, 0));

// 天花板
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(R * 2, R * 2), S(wallTex, 0xbfb4a6, .98));
ceil.rotation.x = Math.PI / 2;
ceil.position.y = H;
shell.add(ceil);

/* 隔断：留出门洞 */
function wallX(x, z0, z1, doorAt, doorW) {      // 沿 z 方向的墙
  const segs = [];
  if (doorAt === null) segs.push([z0, z1]);
  else {
    segs.push([z0, doorAt - doorW / 2]);
    segs.push([doorAt + doorW / 2, z1]);
  }
  segs.forEach(([a, b]) => {
    if (b - a < 0.05) return;
    shell.add(put(softBox(0.12, H, b - a, M.wall, .02), x, H / 2, (a + b) / 2));
  });
  if (doorAt !== null) {
    shell.add(put(softBox(0.12, H - 2.1, doorW, M.wall, .02), x, (H + 2.1) / 2, doorAt));
  }
}
function wallZ(z, x0, x1, doorAt, doorW) {      // 沿 x 方向的墙
  const segs = [];
  if (doorAt === null) segs.push([x0, x1]);
  else {
    segs.push([x0, doorAt - doorW / 2]);
    segs.push([doorAt + doorW / 2, x1]);
  }
  segs.forEach(([a, b]) => {
    if (b - a < 0.05) return;
    shell.add(put(softBox(b - a, H, 0.12, M.wall, .02), (a + b) / 2, H / 2, z));
  });
  if (doorAt !== null) {
    shell.add(put(softBox(doorW, H - 2.1, 0.12, M.wall, .02), doorAt, (H + 2.1) / 2, z));
  }
}

// 主卧与客厅之间（z=1，x -6..-1），门在 x=-3.5
wallZ(1, -R, -1, -3.5, 1.0);
// 左区与客厅之间（x=-1，z -5..1），门在 z=-3
wallX(-1, -5, 1, -3, 1.0);
// 猫房与走廊之间（x=1，z -6..-1），门在 z=-3.5
wallX(1, -R, -1, -3.5, 1.0);
// 猫房与客厅之间（z=-1，x 1..6），门在 x=3.5
wallZ(-1, 1, R, 3.5, 1.0);
// 走廊与客厅之间（z=-1，x -1..1）开放，不放墙

/* 窗 + 百叶 */
const cityTex = canvasTex(512, 512, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#0b2a44'); grd.addColorStop(.5, '#12496b'); grd.addColorStop(1, '#1a5b74');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    const bw = 10 + Math.random() * 34, bh = 30 + Math.random() * 190;
    const x = Math.random() * w, y = h - bh;
    g.fillStyle = 'rgba(' + (18 + Math.random() * 26) + ',' + (44 + Math.random() * 44) + ',' + (72 + Math.random() * 56) + ',.95)';
    g.fillRect(x, y, bw, bh);
    for (let k = 0; k < 8; k++) if (Math.random() > .5) {
      g.fillStyle = 'rgba(255,' + (196 + Math.random() * 50) + ',' + (140 + Math.random() * 70) + ',' + (.3 + Math.random() * .6) + ')';
      g.fillRect(x + 2 + Math.random() * (bw - 6), y + 4 + Math.random() * (bh - 10), 2, 2);
    }
  }
});

const winGlass = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.55),
  new THREE.MeshBasicMaterial({ map: cityTex, toneMapped: false }));
winGlass.position.set(-5.9, 1.62, 4.6);
winGlass.rotation.y = Math.PI / 2;
winGlass.rotation.y = Math.PI / 2;
room.add(winGlass);

const blindMat = new THREE.MeshStandardMaterial({ color: 0x6d7784, roughness: .75, metalness: .2 });
for (let i = 0; i < 11; i++) {
  room.add(put(softBox(0.02, 0.055, 2.06, blindMat, .01), -3.45, 2.32 - i * 0.135, -0.5));
}
room.add(put(softBox(0.06, 1.62, 0.06, M.metal, .01), -3.44, 1.62, -1.55));
room.add(put(softBox(0.06, 1.62, 0.06, M.metal, .01), -3.44, 1.62, 0.55));

const winLight = new THREE.PointLight(0x7fc8f0, 5.5, 7, 2);
winLight.position.set(-5.4, 1.7, 4.6);
room.add(winLight);

/* 床 */
const bed = new THREE.Group();
bed.position.set(-4.00, 0, 4.55);
bed.rotation.y = Math.PI;
room.add(bed);
bed.add(put(softBox(2.1, 0.34, 1.55, M.dark, .05), 0, 0.17, 0));
bed.add(put(softBox(2.02, 0.24, 1.46, M.linen, .09), 0, 0.42, 0));
bed.add(put(softBox(1.98, 0.12, 1.42, S(clothTex, 0xd7e8f5, .97), .07), 0, 0.56, 0.03));
bed.add(put(softBox(0.62, 0.16, 0.34, M.linen, .09), -0.62, 0.60, -0.44));
bed.add(put(softBox(0.5, 0.14, 0.3, M.linen, .08), 0.05, 0.59, -0.45));
bed.add(put(softBox(2.12, 0.72, 0.12, M.wood, .04), 0, 0.62, -0.82));

/* 沙发 */
const sofa = new THREE.Group();
sofa.position.set(2.40, 0, 3.60);
sofa.rotation.y = 0.34;
room.add(sofa);
sofa.add(put(softBox(1.9, 0.34, 0.9, M.cream, .12), 0, 0.32, 0));
sofa.add(put(softBox(1.9, 0.62, 0.22, M.cream, .1), 0, 0.6, -0.46));
sofa.add(put(softBox(0.22, 0.54, 0.9, M.cream, .1), -0.9, 0.5, 0));
sofa.add(put(softBox(0.22, 0.54, 0.9, M.cream, .1), 0.9, 0.5, 0));
sofa.add(put(softBox(1.7, 0.16, 0.78, M.linen, .08), 0, 0.47, 0.02));
for (const dx of [-0.78, 0.78]) for (const dz of [-0.32, 0.32])
  sofa.add(put(softBox(0.09, 0.16, 0.09, M.dark, .02), dx, 0.08, dz));
sofa.add(put(softBox(0.44, 0.18, 0.34, M.linen, .09), -0.46, 0.58, 0.05));
sofa.add(put(softBox(0.4, 0.16, 0.3, S(clothTex, 0xc9dff0, .98), .08), 0.42, 0.57, 0));

/* 橱柜 */
const cab = new THREE.Group();
cab.position.set(-5.62, 0, 2.40);
room.add(cab);
cab.add(put(softBox(0.62, 2.5, 2.7, M.wood, .03), 0, 1.25, 0));
cab.add(put(softBox(0.68, 0.05, 2.2, S(woodTex, 0x9d8468, .5), .01), -0.04, 1.42, 0.1));
cab.add(put(softBox(0.2, 0.3, 0.18, M.linen, .05), -0.14, 1.6, 0.62));
cab.add(put(softBox(0.11, 0.18, 0.11, new THREE.MeshStandardMaterial({ color: 0x2f5d3a, roughness: .6 }), .03), -0.16, 1.54, 0.24));
cab.add(put(softBox(0.11, 0.18, 0.11, new THREE.MeshStandardMaterial({ color: 0x6b4a1f, roughness: .6 }), .03), -0.16, 1.54, 0.06));
cab.add(put(softBox(0.3, 0.04, 0.4, M.dark, .01), -0.12, 1.53, -0.5));

/* 桌 + 显示器 + 椅 */
const desk = new THREE.Group();
desk.position.set(-3.50, 0, -4.55);

/* ============================ 骨骼表（VRM / glb 通用） ============================ */
const skel = {};      // hips/spine/chest/neck/head/armL/armR/foreL/foreR/legL/legR/shinL/shinR/footL/footR

function matchBone(name) {
  const n = name.toLowerCase();
  if (/hair|skirt|cloth|ear|tail|wing|ribbon|accessory/.test(n)) return null;
  if (/hips|pelvis/.test(n)) return 'hips';
  if (/upperchest|chest/.test(n)) return 'chest';
  if (/spine/.test(n)) return 'spine';
  if (/neck/.test(n)) return 'neck';
  if (/head/.test(n)) return 'head';
  const L = /(^|[_\s])l([_\s]|$)|left/.test(n);
  const R = /(^|[_\s])r([_\s]|$)|right/.test(n);
  if (/upperarm|upper_arm|shoulder/.test(n)) return L ? 'armL' : (R ? 'armR' : null);
  if (/lowerarm|forearm/.test(n)) return L ? 'foreL' : (R ? 'foreR' : null);
  if (/upperleg|thigh/.test(n)) return L ? 'legL' : (R ? 'legR' : null);
  if (/lowerleg|calf|shin/.test(n)) return L ? 'shinL' : (R ? 'shinR' : null);
  if (/foot|ankle/.test(n)) return L ? 'footL' : (R ? 'footR' : null);
  return null;
}

function collectBones(root) {
  Object.keys(skel).forEach(k => delete skel[k]);
  root.traverse(o => {
    if (!o.isBone) return;
    const key = matchBone(o.name);
    if (key && !skel[key]) skel[key] = o;
  });
  console.log('[room] 骨骼匹配:', Object.keys(skel).join(','));
}

let modelRoot = null;
let modelActions = {};
let modelCurrent = null;

window.__model = () => {
  if (!modelRoot) return null;
  const b = new THREE.Box3().setFromObject(modelRoot);
  return { visible: modelRoot.visible, pos: modelRoot.position.toArray().map(v => +v.toFixed(2)),
    scale: +modelRoot.scale.x.toFixed(3),
    size: [b.max.x-b.min.x, b.max.y-b.min.y, b.max.z-b.min.z].map(v=>+v.toFixed(2)),
    minY: +b.min.y.toFixed(2), anchor: bh.anchor, skel: Object.keys(skel).length };
};

function onModelReady(root, gltf) {
  modelRoot = root;
  girl.visible = false;                    // 隐藏程序化小人
  if (typeof contact !== 'undefined' && contact) contact.visible = false;
  modelActions = {};
  (gltf.animations || []).forEach(clip => { modelActions[clip.name] = clip; });
  modelCurrent = null;
  console.log('[room] 模型动作:', Object.keys(modelActions).join(', '));
  if (typeof bh !== 'undefined' && bh.anchor) {
    applyAnchor(bh.anchor, true);
    if (bh.state === 'walk' && bh.target) playModel('walk');
  }
}

function playModel(name, timeout) {
  if (!modelRoot || !modelActions[name]) return;
  if (modelCurrent === name) return;
  modelCurrent = name;
  const clip = modelActions[name];
  if (mixer) mixer.stopAllAction();
  const act = mixer.clipAction(clip);
  act.reset();
  act.setLoop(name === 'walk' || name === 'idle' ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  if (name !== 'walk' && name !== 'idle') act.clampWhenFinished = true;
  act.play();
}

function placeModel(x, y, z, rotY) {
  if (vrmModel) {
    vrmModel.position.x = x;
    vrmModel.position.z = z;
    vrmModel.rotation.y = (rotY || 0) + Math.PI;   // 该模型导出朝向与锚点相反
    return;
  }
  if (!modelRoot) return;
  modelRoot.position.set(x, y, z);
  modelRoot.rotation.y = rotY || 0;
}

    if (!o.isMesh) return;
    // 隐藏头顶上方的大块“说明牌”
    box.setFromObject(o);
    const h = box.max.y - box.min.y;
    const cy = (box.max.y + box.min.y) / 2;
    if (!o.isSkinnedMesh && h > 0.6 && cy > 1.9) {
      o.visible = false; hidden++;
      return;
    }
    const conv = m => {
      if (!m) return m;
      if (m.type === 'MeshToonMaterial' || m.type === 'MeshStandardMaterial') return m;
      const t = new THREE.MeshToonMaterial({
        color: (m.color && m.color.clone) ? m.color.clone() : new THREE.Color(0xffffff),
        map: m.map || null,
        transparent: !!m.transparent,
        opacity: (m.opacity === undefined ? 1 : m.opacity),
        side: m.side !== undefined ? m.side : THREE.FrontSide,
        alphaTest: m.alphaTest || 0,
        depthWrite: m.depthWrite !== undefined ? m.depthWrite : true,
      });
      if (m.emissive) { t.emissive = m.emissive.clone(); t.emissiveMap = m.emissiveMap || null; }
      t.name = (m.name || '') + '_conv';
      fixed++;
      return t;
    };
    if (Array.isArray(o.material)) o.material = o.material.map(conv);
    else o.material = conv(o.material);
    o.castShadow = true;
  });
  console.log('[room] 材质重建', fixed, '个，隐藏说明牌', hidden, '块');
}

window.__badMeshes = () => {
  const out = [];
  if (!vrmModel) return out;
  vrmModel.traverse(o => {
    if (!o.isMesh) return;
    const mats = (Array.isArray(o.material) ? o.material : [o.material]).filter(Boolean);
    const types = mats.map(m => m.type).join('+');
    if (mats.length && !types.includes('MToon')) {
      const b = new THREE.Box3().setFromObject(o);
      out.push({ name: o.name, types,
        size: [b.max.x-b.min.x, b.max.y-b.min.y, b.max.z-b.min.z].map(v=>+v.toFixed(2)),
        cy: +((b.max.y+b.min.y)/2).toFixed(2),
        hasMap: mats.some(m => !!m.map) });
    }
  });
  return out;
};

function loadVRM() {
  return new Promise(resolve => {
    const loader = new GLTFLoader();
    loader.register(parser => new VRMLoaderPlugin(parser));
    loader.load('./model/character.vrm', gltf => {
      const vrm = gltf.userData.vrm;
      if (!vrm) { resolve(false); return; }
      try {
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
      } catch (e) { console.log('[room] VRM 优化跳过', e && e.message); }
      const root = vrm.scene;
      // 量身高并缩放到 1.55 m
      const box = new THREE.Box3().setFromObject(root);
      const h = Math.max(0.01, box.max.y - box.min.y);
      root.scale.setScalar(1.55 / h);
      const box2 = new THREE.Box3().setFromObject(root);
      vrmGroundY = -box2.min.y;
      root.position.y = vrmGroundY;
      root.rotation.y = Math.PI;            // VRM 默认朝 -Z，转成朝 +Z
      scene.add(root);
      // 只隐藏非蒙皮的“版权牌/说明板”，别误伤身体网格
      root.traverse(o => {
        if (o.isMesh && !o.isSkinnedMesh &&
            /credit|licen[cs]e|readme|plate|sign|board|notice/i.test(o.name || '')) {
          o.visible = false;
          console.log('[room] 隐藏说明牌:', o.name);
        }
      });
      // 只隐藏：脸部叠加面片 / 版权牌 / 草帽猫耳 / MToon 描边壳
      const objRe = /emoteatlas|ve_emote|strawhat|cat_?ear|foxtail|credit|licen[cs]e/i;
      let hiddenN = 0;
      root.traverse(o => {
        if (!o.isMesh) return;
        const mats = (Array.isArray(o.material) ? o.material : [o.material]).filter(Boolean);
        const outline = mats.some(m => /^mtoon outline/i.test(m.name || ''));
        if (outline || objRe.test(o.name || '')) {
          o.visible = false; hiddenN++;
        }
      });
      console.log('[room] 隐藏叠加网格', hiddenN, '个');
      rebuildMaterials(root);
      vrmModel = root;
      vrmHumanoid = vrm.humanoid;
      collectBones(root);
      // VRM 必须在“归一化骨骼”上摆姿势，否则 humanoid.update() 会覆盖
      const NORM = { hips:'hips', spine:'spine', chest:'chest', neck:'neck', head:'head',
        armL:'leftUpperArm', foreL:'leftLowerArm', armR:'rightUpperArm', foreR:'rightLowerArm',
        legL:'leftUpperLeg', shinL:'leftLowerLeg', footL:'leftFoot',
        legR:'rightUpperLeg', shinR:'rightLowerLeg', footR:'rightFoot' };
      Object.keys(NORM).forEach(k => {
        const nb = (() => { try { return vrm.humanoid.getNormalizedBoneNode(NORM[k]); } catch (e) { return null; } })();
        if (nb) skel[k] = nb;
      });
      vrmBones = {};
      ['hips', 'spine', 'chest', 'neck', 'head',
       'leftUpperArm', 'leftLowerArm', 'rightUpperArm', 'rightLowerArm',
       'leftUpperLeg', 'leftLowerLeg', 'leftFoot', 'rightUpperLeg', 'rightLowerLeg', 'rightFoot']
        .forEach(n => { vrmBones[n] = normBone(n); });
      girl.visible = false;
      if (contact) contact.visible = false;
      console.log('[room] VRM 已加载，身高缩放到 1.55m');
      resolve(true);
    }, undefined, err => {
      console.log('[room] VRM 加载失败，回退', err && err.message);
      resolve(false);
    });
  });
}

function loadCharacter() {
  return new Promise(resolve => {
    const loader = new GLTFLoader();
    if (!USE_CHARACTER_GLB) { resolve(false); return; }
    loader.load('./model/character.glb', gltf => {
      const root = gltf.scene;
      root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const scale = 1.45 / Math.max(0.001, size.y);
      root.scale.setScalar(scale);
      const box2 = new THREE.Box3().setFromObject(root);
      root.position.y -= box2.min.y;
      scene.add(root);
      externalModel = root;

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(root);
        gltf.animations.forEach(clip => { actions[clip.name] = mixer.clipAction(clip); });
        const names = gltf.animations.map(c => c.name);
        actions.__idle = actions[pickAction(names, ['idle', 'stand', 'wait', 'breath'])];
        actions.__sleep = actions[pickAction(names, ['sleep', 'lie', 'rest'])];
        actions.__work = actions[pickAction(names, ['work', 'type', 'sit', 'desk'])];
        actions.__phone = actions[pickAction(names, ['phone', 'play', 'idle'])];
        if (actions.__idle) actions.__idle.play();
      }
      console.log('[room] 外部模型已加载，动画', gltf.animations ? gltf.animations.length : 0, '个');
      // 隐藏版权说明牌：扁平、宽、位置高
      root.traverse(o => {
        if (!o.isMesh) return;
        const b = new THREE.Box3().setFromObject(o);
        const w = b.max.x - b.min.x, d = b.max.z - b.min.z;
        const cy = (b.max.y + b.min.y) / 2;
        if (w > 0.38 && d < 0.10 && cy > 1.15) {
          o.visible = false;
          console.log('[room] 隐藏说明牌网格:', o.name);
        }
      });
      collectBones(root);
      if (typeof onModelReady === 'function') onModelReady(root, gltf);
      resolve(true);
    }, undefined, err => {
      console.log('[room] 没有外部模型，用内置卡通形象', err && err.message);
      resolve(false);
    });
  });
}

function switchAction(slot) {
  if (!mixer) return;
  const next = actions['__' + slot] || actions.__idle;
  if (!next) return;
  Object.values(actions).forEach(a => { if (a && a !== next && a.isRunning && a !== actions.__idle) a.fadeOut(0.3); });
  next.reset().fadeIn(0.3).play();
}

/* ============================ 三室一厅隔墙 ============================ */
function partition(x1, z1, x2, z2, doorAt, doorWidth, doorAxis) {
  // doorAxis: 'x' 表示门洞沿 x 方向开在这段墙里
  const wallH = 2.7;
  if (Math.abs(z2 - z1) < 0.01) {
    // 沿 x 的墙
    const a = Math.min(x1, x2), b = Math.max(x1, x2);
    if (doorAxis === 'x' && doorAt > a && doorAt < b) {
      const half = doorWidth / 2;
      shell.add(put(softBox(doorAt - half - a, wallH, 0.12, M.wall, .02), (a + doorAt - half) / 2, wallH / 2, z1));
      shell.add(put(softBox(b - doorAt - half, wallH, 0.12, M.wall, .02), (b + doorAt + half) / 2, wallH / 2, z1));
      shell.add(put(softBox(doorWidth, 0.5, 0.12, M.wall, .02), doorAt, wallH - 0.25, z1));
    } else {
      shell.add(put(softBox(b - a, wallH, 0.12, M.wall, .02), (a + b) / 2, wallH / 2, z1));
    }
  } else {
    // 沿 z 的墙
    const a = Math.min(z1, z2), b = Math.max(z1, z2);
    if (doorAxis === 'z' && doorAt > a && doorAt < b) {
      const half = doorWidth / 2;
      shell.add(put(softBox(0.12, wallH, doorAt - half - a, M.wall, .02), x1, wallH / 2, (a + doorAt - half) / 2));
      shell.add(put(softBox(0.12, wallH, b - doorAt - half, M.wall, .02), x1, wallH / 2, (b + doorAt + half) / 2));
      shell.add(put(softBox(0.12, 0.5, doorWidth, M.wall, .02), x1, wallH - 0.25, doorAt));
    } else {

// 有 model/room.glb 就用它，隐藏代码生成的墙地
function loadRoomShell() {
  return new Promise(resolve => {
    const loader = new GLTFLoader();
    loader.load('./model/room.glb', gltf => {
      const g = gltf.scene;
      g.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = true; o.receiveShadow = true;
        if (/tvscreen/i.test(o.name)) {
          o.material = new THREE.MeshStandardMaterial({
            color: 0x0a1620, emissive: 0x000000, roughness: 0.25, metalness: 0.0
          });
          glbTvScreen = o;
        }
      });
      scene.add(g);
      shell.visible = false;
      // Blender 模型自带家具：隐藏代码生成的所有家具，只留灯光/猫/人物
      const keep = new Set([girl, contact]);
      (typeof cats !== 'undefined' ? cats : []).forEach(c => keep.add(c.c));
      let hidden = 0;
      room.children.forEach(o => {
        if (o.isLight || keep.has(o)) return;
        o.visible = false; hidden++;
      });
      console.log('[room] 已加载 Blender 房型，隐藏代码家具', hidden, '件');
      resolve(true);
    }, undefined, err => {
      console.log('[room] 没有 room.glb，用代码生成的墙地', err && err.message);
      resolve(false);
    });
  });
}

function buildCat(bodyColor, tailColor, scale) {
  const g = new THREE.Group();
  const fur = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: .92 });
  const fur2 = new THREE.MeshStandardMaterial({ color: tailColor, roughness: .92 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), fur);
  body.scale.set(1.0, 0.85, 1.45); body.position.y = 0.12; body.castShadow = true; g.add(body);
  const head = new THREE.Group(); head.position.set(0, 0.20, 0.16); g.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 12), fur);
  skull.scale.set(1, 0.95, 0.95); skull.castShadow = true; head.add(skull);
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.038, 0.065, 4), fur);
    ear.position.set(sx * 0.045, 0.075, -0.005); ear.rotation.z = sx * 0.22; head.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0x1c2a30 }));
    eye.position.set(sx * 0.032, 0.012, 0.075); head.add(eye);
  }
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.02, 0.3, 8), fur2);
  tail.position.set(0, 0.16, -0.19); tail.rotation.x = 1.15; g.add(tail);
  for (const [dx, dz] of [[-0.07, 0.12], [0.07, 0.12], [-0.07, -0.1], [0.07, -0.1]]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.02, 0.11, 6), fur2);
    leg.position.set(dx, 0.055, dz); g.add(leg);
  }
  g.scale.setScalar(scale || 1);
  return { group: g, head, tail };
}

  { c: buildCat(0xd8dde3, 0xa8b0ba, 1.15), name: '豆豆', spot: 0, target: 0, state: 'sleep', t: 0, phase: 0 },
  { c: buildCat(0xf2ece4, 0xc9b8a6, 1.0), name: '妞妞', spot: 3, target: 3, state: 'walk', t: 0, phase: 2 },
  { c: buildCat(0xf6d9a8, 0xd8a86a, 0.9), name: '点点', spot: 1, target: 1, state: 'sleep', t: 0, phase: 4 },
];

  const sp = CAT_SPOTS[cat.spot];
  cat.c.group.position.set(sp.pos[0], sp.pos[1], sp.pos[2]);
  cat.c.group.rotation.y = sp.rot;
  scene.add(cat.c.group);
});

let catsActive = true;
function updateCats(dt) {
  if (!catsActive) return;
  cats.forEach(cat => {
    cat.t += dt;
    const g = cat.c.group;
    cat.c.tail.rotation.z = Math.sin(cat.t * 2.2 + cat.phase) * 0.25;
    cat.c.head.rotation.y = Math.sin(cat.t * 0.7 + cat.phase) * 0.35;
    if (cat.state === 'walk') {
      const sp = CAT_SPOTS[cat.target];
      const dx = sp.pos[0] - g.position.x, dz = sp.pos[2] - g.position.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.06) { cat.state = 'sleep'; cat.spot = cat.target; cat.t = 0; }
      else {
        const v = 0.35 * dt;
        g.position.x += dx / d * v; g.position.z += dz / d * v;
        g.rotation.y = Math.atan2(dx, dz);
        g.position.y = sp.pos[1] + Math.abs(Math.sin(cat.t * 9)) * 0.012;
      }
    } else if (cat.t > 12 + cat.phase * 4) {
      // 醒了，换个地方
      cat.state = 'walk';
      cat.target = Math.floor(Math.random() * CAT_SPOTS.length);
      cat.t = 0;
    }
  });
}

function clampToRoom(px, pz, ax, az) {
  // 四个区域的可站范围（离墙 0.6 m）
  let box;
  if (az > 1 && ax < -1)        box = [-5.4, -1.6, 1.6, 5.4];    // 主卧
  else if (ax < -1)             box = [-5.4, -1.6, -4.6, -1.6];  // 电竞房
  else if (az < -1)             box = [1.6, 5.4, -5.4, -1.6];    // 猫房
  else                          box = [-0.4, 5.4, -0.4, 5.4];    // 客厅
  return [Math.min(box[1], Math.max(box[0], px)),
          Math.min(box[3], Math.max(box[2], pz))];
}

function autoCam(anchorName) {
  const a = ANCHOR[anchorName];
  if (!a) return null;
  const dist = a.camDist || 2.9;
  const ry = a.rotY || 0;
  const bx = Math.sin(ry), bz = Math.cos(ry);
  const raw = [a.pos[0] + bx * dist + bz * 0.85,
               a.pos[2] + bz * dist - bx * 0.85];
  const cl = clampToRoom(raw[0], raw[1], a.pos[0], a.pos[2]);
  return {
    pos: [cl[0], a.pos[1] + (a.camH || 1.30), cl[1]],
    target: [a.pos[0], a.pos[1] + 0.28, a.pos[2]]
  };
}

  bh.facing = Math.atan2(a.pos[0] - girl.position.x, a.pos[2] - girl.position.z);
  poseTarget = Object.assign({}, POSE.walk);

function walkStep(dt) {
  if (!bh.target) return;
  const dx = bh.target.x - girl.position.x;
  const dz = bh.target.z - girl.position.z;
  const dist = Math.hypot(dx, dz);
  const speed = 0.75;
  if (dist < 0.07) {
    bh.state = 'idle';
    const t = bh.target;
    bh.target = null;
    applyAnchor(t.name, false);
    return;
  }
  const step = Math.min(speed * dt, dist);
  girl.position.x += (dx / dist) * step;
  girl.position.z += (dz / dist) * step;
  const want = Math.atan2(dx, dz);
  let diff = want - girl.rotation.y;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  girl.rotation.y += diff * Math.min(1, dt * 8);
  bh.walkPhase += dt * 7.2;
  const sw = Math.sin(bh.walkPhase);
  cur.rotX = 0;
  cur.thigh = 0.55 * sw;
  cur.shin = Math.max(0, -sw) * 0.7;
  cur.armL = -0.35 * sw;
  cur.armR = 0.35 * sw;
  cur.torso = 0.04;
  cur.head = 0;
  girl.position.y = Math.abs(Math.sin(bh.walkPhase)) * 0.02 + 0.44;
  hips.rotation.x = 0;
  torso.rotation.x = cur.torso;
  legL.thigh.rotation.x = cur.thigh;
  legR.thigh.rotation.x = -cur.thigh;
  legL.shin.rotation.x = cur.shin;
  legR.shin.rotation.x = Math.max(0, sw) * 0.7;
  armL.up.rotation.x = cur.armL;
  armR.up.rotation.x = cur.armR;
}

/* ============================ 相机 ============================ */
const CAM = {
  sleep: { pos: [-2.2, 1.6, 3.6], target: [-4.0, 0.7, 4.4] },
  phone: { pos: [-2.2, 1.6, 3.6], target: [-4.0, 0.7, 4.4] },
  tv: { pos: [2.4, 1.5, 2.2], target: [2.4, 0.9, 3.7] },
  sofa: { pos: [2.4, 1.5, 2.2], target: [2.4, 0.9, 3.7] },
  desk: { pos: [-1.8, 1.5, -2.6], target: [-3.5, 0.9, -4.2] },
  gaming: { pos: [-1.8, 1.5, -2.6], target: [-3.5, 0.9, -4.2] },
  window: { pos: [-4.2, 1.5, 4.6], target: [-5.9, 0.9, 4.6] },
  away: { pos: [0.3, 18, 11], target: [0.0, 0.2, 0.4] },
  catbed: { pos: [0.6, 1.4, -1.2], target: [2.4, 0.5, -2.4] },
  catroom: { pos: [0.6, 1.4, -1.2], target: [2.4, 0.5, -2.4] },
  dresser: { pos: [-2.6, 1.5, 4.8], target: [-1.8, 0.9, 3.2] },
  rug: { pos: [1.0, 1.6, 5.4], target: [2.4, 0.4, 4.3] }
};
let freeCam = false;


/* ============================ 视角控制 ============================ */
const OVERVIEW = { pos: [0.2, 19.5, 12.5], target: [0.0, 0.1, 0.4] };

function gotoOverview() {
  camAuto = false;
  freeCam = true;
  camera.position.set(OVERVIEW.pos[0], OVERVIEW.pos[1], OVERVIEW.pos[2]);
  controls.target.set(OVERVIEW.target[0], OVERVIEW.target[1], OVERVIEW.target[2]);
  controls.update();
  syncCamBtn();
}

function syncCamBtn() {
  const b = document.getElementById('btn-free');
  if (!b) return;
  const following = !freeCam;
  b.textContent = following ? '跟随中' : '自由';
  b.classList.toggle('on', following);
}

const btnAll = document.getElementById('btn-all');
const btnFree = document.getElementById('btn-free');
if (btnAll) btnAll.addEventListener('click', gotoOverview);
if (btnFree) btnFree.addEventListener('click', () => {
  freeCam = !freeCam;
  if (!freeCam) { camAuto = true; camSnap = true; }
  syncCamBtn();
});

let camGoal = CAM.sleep, camBlend = 0;
let camSnap = true;
const ANCHOR_CAM = { tv: 'tv', sofa: 'sofa', bed: 'phone', sleep: 'sleep', desk: 'gaming', window: 'window', center: 'away', catbed: 'catroom', catroom: 'catroom', dresser: 'dresser', rug: 'rug', gaming: 'gaming' };

/* ============================ 灯光 ============================ */
scene.add(new THREE.HemisphereLight(0xdff0ff, 0x9fb4c6, 1.05));
scene.add(new THREE.AmbientLight(0xc8dced, 0.65));
const key = new THREE.DirectionalLight(0xfff6e8, 0.85);
key.position.set(3.2, 4.2, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.001;
scene.add(key);

const ceilLight = new THREE.PointLight(0xffe0bc, 6, 8, 2);
ceilLight.position.set(0, 2.85, -0.6);
scene.add(ceilLight);

/* ============================ 数据 ============================ */
let lastCount = -1;
const esc = (t) => String(t || '').replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

function renderChat(bubbles) {
  document.getElementById('chat-list').innerHTML = bubbles.slice(-6).map((b) =>
    '<div class="row ' + (b.who === 'you' ? 'you' : 'her') + '"><div class="b">' + esc(b.text) + '</div></div>'
  ).join('');
}
function setMood(m) {
  const joy = (m.joy === undefined) ? .5 : m.joy;
  const calm = (m.calm === undefined) ? .5 : m.calm;
  document.getElementById('m-joy').textContent = joy.toFixed(2);
  document.getElementById('m-calm').textContent = calm.toFixed(2);
  document.getElementById('b-joy').style.width = (joy * 100) + '%';
  document.getElementById('b-calm').style.width = (calm * 100) + '%';
  const cort = (m.cort === undefined) ? 0.2 : m.cort;
  const oxy = (m.oxy === undefined) ? 0.5 : m.oxy;
  document.getElementById('m-cort').textContent = cort.toFixed(2);
  document.getElementById('m-oxy').textContent = oxy.toFixed(2);
  document.getElementById('b-cort').style.width = (cort * 100) + '%';
  document.getElementById('b-oxy').style.width = (oxy * 100) + '%';
}
function applyMode(m) {
  if (m === mode) return;
  mode = m;
  const anchor = MODE_ANCHOR[m];
  if (anchor && bh.anchor !== anchor) {
    goTo(anchor);                       // 先走过去，到位后自动坐下/躺下
    camAuto = true;
    if (CAM[anchor]) { camGoal = CAM[anchor]; camBlend = 0; camSnap = true; }
    return;
  }
  const p = MODE_POSE[m] || 'stand';
  poseTarget = POSE[p] || POSE.stand;
  switchAction(p === 'sleep' ? 'sleep' : (p === 'sit' ? 'work' : (p === 'lie' ? 'phone' : 'idle')));
  camGoal = CAM[p] || CAM.away;
  camBlend = 0;
}
async function poll() {
  try {
    const r = await fetch('./room.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('s-label').textContent = d.label || '—';
    document.getElementById('s-clock').textContent = d.clock || '--:--';
    setMood(d.mood || {});
    applyMode(d.mode || 'sleep');
    const b = d.bubbles || [];
    if (b.length !== lastCount) { lastCount = b.length; renderChat(b); }
  } catch (e) { /* 静默 */ }
}
setInterval(poll, 2500);
poll();


/* ============================ 动作库 ============================ */
const V = (x, y, z) => new THREE.Vector3(x, y, z);

function resetBones() {
  ['hips','spine','chest','neck','head','armL','foreL','armR','foreR',
   'legL','shinL','footL','legR','shinR','footR'].forEach(k => {
    const b = skel[k];
    if (b) b.rotation.set(0, 0, 0);
  });
}

// 每个动作：t 是时间，p 是 0→1→0 的包络（用于过渡强度）
const ACT = {
  idle(t) {
    aimBone('armL', 'foreL', V(0.10, -1, 0.02));
    aimBone('armR', 'foreR', V(-0.10, -1, 0.02));
    setBone('chest', Math.sin(t * 1.6) * 0.02, 0, 0);
    setBone('head', Math.sin(t * 0.8) * 0.05, Math.sin(t * 0.5) * 0.12, 0);
  },

  stretch(t, p) {
    aimBone('armL', 'foreL', V(0.45, 0.85, -0.15));
    aimBone('armR', 'foreR', V(-0.45, 0.85, -0.15));
    setBone('chest', -0.18 * p, 0, 0);
    setBone('head', -0.22 * p, 0, 0);
    setBone('spine', -0.08 * p, 0, 0);
  },

  yawn(t, p) {
    aimBone('armR', 'foreR', V(0.18, -0.25, 0.95));
    aimBone('armL', 'foreL', V(0.12, -1, 0.05));
    setBone('head', -0.30 * p, 0, 0);
    setBone('chest', -0.06 * p, 0, 0);
  },

  wave(t, p) {
    aimBone('armR', 'foreR', V(0.55, 0.95, 0.15));
    aimBone('armL', 'foreL', V(0.12, -1, 0.03));
    setBone('head', 0.04, 0.15 * Math.sin(t * 6) * p, 0.08 * p);
  },

  phone(t, p) {
    aimBone('armR', 'foreR', V(0.10, -0.15, 1.0));
    aimBone('armL', 'foreL', V(0.16, -0.95, 0.25));
    setBone('head', 0.28 * p, 0, 0);
    setBone('chest', 0.10 * p, 0, 0);
  },

  hair(t, p) {
    aimBone('armR', 'foreR', V(0.75, 0.55, 0.25));
    aimBone('armL', 'foreL', V(0.12, -1, 0.03));
    setBone('head', 0.02, 0.10 * Math.sin(t * 3) * p, 0.10 * p);
  },

  look(t, p) {
    aimBone('armL', 'foreL', V(0.10, -1, 0.02));
    aimBone('armR', 'foreR', V(-0.10, -1, 0.02));
    setBone('head', 0.03, Math.sin(t * 1.1) * 0.35 * p, 0.05 * p);
    setBone('chest', 0, Math.sin(t * 0.7) * 0.08 * p, 0);
  },

  read(t, p) {
    aimBone('armL', 'foreL', V(0.10, -0.55, 1.0));
    aimBone('armR', 'foreR', V(-0.10, -0.55, 1.0));
    setBone('head', 0.22 * p, 0, 0);
    setBone('chest', 0.08 * p, 0, 0);
  },

  typing(t, p) {
    const j = Math.sin(t * 12) * 0.05;
    aimBone('armL', 'foreL', V(0.16, -0.75, 0.9 + j));
    aimBone('armR', 'foreR', V(-0.16, -0.75, 0.9 - j));
    setBone('head', 0.16 * p, 0, 0);
    setBone('chest', 0.06 * p, 0, 0);
  },

  dance(t, p) {
    const s = Math.sin(t * 4.2);
    aimBone('armL', 'foreL', V(0.9 * s, 0.75, 0.25));
    aimBone('armR', 'foreR', V(-0.9 * s, 0.75, -0.25));
    setBone('chest', 0.05, s * 0.14 * p, 0);
    setBone('head', 0, s * 0.16 * p, 0);
    setBone('legL', 0.12 * s, 0, 0.05);
    setBone('legR', -0.12 * s, 0, -0.05);
  },

  yoga(t, p) {
    aimBone('armL', 'foreL', V(0.35, 0.75, 0.55));
    aimBone('armR', 'foreR', V(-0.35, 0.75, 0.55));
    setBone('chest', 0.10 * p, 0, 0);
    setBone('head', -0.12 * p, 0, 0);
    setBone('legL', -1.15, 0, 0.08);
    setBone('legR', -1.15, 0, -0.08);
    setBone('shinL', 1.35, 0, 0);
    setBone('shinR', 1.35, 0, 0);
  },

  pet(t, p) {
    aimBone('armL', 'foreL', V(0.10, -0.55, 1.05));
    aimBone('armR', 'foreR', V(-0.05, -0.50, 1.10));
    setBone('chest', 0.30 * p, 0, 0);
    setBone('head', 0.26 * p, 0, 0);
    setBone('legL', -1.05, 0, 0.06);
    setBone('legR', -1.05, 0, -0.06);
    setBone('shinL', 1.55, 0, 0);
    setBone('shinR', 1.55, 0, 0);
  },

  sit(t) {
    aimBone('armL', 'foreL', V(0.12, -1, 0.30));
    aimBone('armR', 'foreR', V(-0.12, -1, 0.30));
    setBone('legL', -1.30, 0, 0.05);
    setBone('legR', -1.30, 0, -0.05);
    setBone('shinL', 1.25, 0, 0);
    setBone('shinR', 1.25, 0, 0);
    setBone('chest', 0.06, 0, 0);
  },

  lie(t) {
    aimBone('armL', 'foreL', V(0.35, -0.35, 0.85));
    aimBone('armR', 'foreR', V(-0.35, -0.35, 0.85));
    setBone('head', 0.20, 0, 0);
    setBone('legL', 0.10, 0, 0.04);
    setBone('legR', 0.10, 0, -0.04);
  },

  sleep(t) {
    aimBone('armL', 'foreL', V(0.30, -0.45, 0.85));
    aimBone('armR', 'foreR', V(-0.30, -0.45, 0.85));
    setBone('head', 0.10, 0, 0);
    setBone('chest', Math.sin(t * 0.9) * 0.03, 0, 0);
  },

  walk(t) {
    const sw = Math.sin(t * 7.0);
    aimBone('armL', 'foreL', V(0.08, -1, 0.42 * sw));
    aimBone('armR', 'foreR', V(-0.08, -1, -0.42 * sw));
    setBone('legL', 0.55 * sw, 0, 0);
    setBone('legR', -0.55 * sw, 0, 0);
    setBone('shinL', Math.max(0, -sw) * 0.7, 0, 0);
    setBone('shinR', Math.max(0, sw) * 0.7, 0, 0);
    setBone('spine', 0.03, 0, 0);
  }
};

// 空闲时随机冒出来的小动作
const IDLE_ACTIONS = ['stretch', 'yawn', 'wave', 'phone', 'hair', 'dance', 'look'];
let idleAction = null;
let idleUntil = 0;
let idleNext = 3.0;
let forceAction = null;
window.__do = (a) => { forceAction = a; return a; };

/* ============================ VRM 程序化动作 ============================ */
const SKEL_KEY = { hips:'hips', spine:'spine', chest:'chest', neck:'neck', head:'head',
  leftUpperArm:'armL', rightUpperArm:'armR', leftLowerArm:'foreL', rightLowerArm:'foreR',
  leftUpperLeg:'legL', rightUpperLeg:'legR', leftLowerLeg:'shinL', rightLowerLeg:'shinR' };

function setBone(name, x, y, z) {
  const key = SKEL_KEY[name] || name;
  const b = skel[key];
  if (!b) return;
  if (!b.userData._tq) b.userData._tq = b.quaternion.clone();
  b.rotation.set(x || 0, y || 0, z || 0);
}


// 把一根骨骼“指向”世界方向 dir（不猜欧拉角，直接算四元数）
function aimBone(boneKey, childKey, dir, blend) {
  const bone = skel[boneKey], child = skel[childKey];
  if (!bone || !child) return;
  bone.updateWorldMatrix(true, false);
  child.updateWorldMatrix(true, false);
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  bone.getWorldPosition(a);
  child.getWorldPosition(b);
  const cur = b.sub(a).normalize();
  const want = dir.clone().normalize();
  const R = new THREE.Quaternion().setFromUnitVectors(cur, want);
  const pw = new THREE.Quaternion();
  (bone.parent || scene).getWorldQuaternion(pw);
  const local = pw.clone().invert().multiply(R).multiply(pw);
  if (blend !== undefined && blend < 1) {
    local.slerp(new THREE.Quaternion(), 1 - blend);
  }
  bone.quaternion.premultiply(local);
}

function driveVRM(t) {
  if (window.__freeze) return;
  if (!vrmModel && !modelRoot) return;
  const mdl = vrmModel || modelRoot;

  // 当前锚点决定基础动作
  const seatMap = {
    bed: 'lie', sleep: 'sleep', tv: 'sit', sofa: 'sit', rug: 'yoga',
    desk: 'typing', gaming: 'typing', catbed: 'pet', catroom: 'pet',
    dresser: 'hair', window: 'look', away: null
  };
  let base = seatMap[bh.anchor] || 'idle';
  if (bh.state === 'walk') base = 'walk';

  // 空闲时随机触发小动作
  let action = base, p = 1;
  if (forceAction) { action = forceAction; p = 1; }
  if (base !== 'walk') {
    if (idleAction && t < idleUntil) {
      action = idleAction;
      const left = idleUntil - t;
      p = Math.min(1, Math.min(t - (idleUntil - 3.0), left) * 2.5);
    } else if (t > idleNext) {
      idleAction = IDLE_ACTIONS[Math.floor(Math.random() * IDLE_ACTIONS.length)];
      idleUntil = t + 2.5 + Math.random() * 2;
      idleNext = idleUntil + 5 + Math.random() * 8;
      action = idleAction;
      p = 0.2;
    }
  }

  resetBones();
  if (vrmHumanoid) vrmHumanoid.update();
  mdl.updateMatrixWorld(true);

  const fn = ACT[action] || ACT.idle;
  fn(t, p);
  if (vrmHumanoid) vrmHumanoid.update();

  // 朝向与位置
  const an = (typeof ANCHOR !== 'undefined' && bh.anchor) ? ANCHOR[bh.anchor] : null;
  const SEAT_Y = { tv: 0.20, sofa: 0.20, gaming: 0.18, desk: 0.18,
                   bed: 0.52, sleep: 0.55, rug: 0.02, pet: 0.02,
                   catbed: 0.02, catroom: 0.02, dresser: 0.02, window: 0.02, center: 0.02 };
  const seat = (SEAT_Y[bh.anchor] !== undefined ? SEAT_Y[bh.anchor] : 0.02);
  const baseY = vrmModel ? vrmGroundY : 0;

  if (an && bh.state !== 'walk') {
    mdl.position.x = an.pos[0];
    mdl.position.z = an.pos[2];
    mdl.rotation.y = (an.rotY || 0) + (vrmModel ? Math.PI : 0);
    mdl.rotation.x = (base === 'lie' || base === 'sleep') ? -Math.PI / 2 : 0;
    mdl.position.y = baseY + ((base === 'lie' || base === 'sleep') ? 0.62 : seat);
  }
}

/* ============================ 循环 ============================ */
const t0 = performance.now();
function tick(now) {
  const _dt = Math.min(0.1, (now - (tick._prev || now)) / 1000);
  tick._prev = now;
  if (bh.state === 'walk') {
    walkStep(_dt);
    if ((modelRoot || vrmModel) && bh.target) {
      if (modelRoot) playModel('walk');
      placeModel(girl.position.x, 0.02, girl.position.z, girl.rotation.y);
    }
  }
  else { applyPose(poseTarget, 0.05); }

  if (!TOPVIEW && !camAuto && performance.now() - camHoldAt > 20000) camAuto = true;
  // 有模型时：相机跟着模型走（固定斜前方），保证始终看得到她
  const followTarget = (vrmModel || modelRoot);
  if (followTarget && camAuto && !freeCam && !TOPVIEW) {
    // 侧向机位：先试一侧，出界就换另一侧，都出界才夹紧
    const anRef = (typeof ANCHOR !== 'undefined' && bh.anchor) ? ANCHOR[bh.anchor] : null;
    const ang = anRef ? (anRef.rotY || 0) : 0;
    const base = followTarget.position;
    const side = new THREE.Vector3(Math.cos(ang), 0, -Math.sin(ang));
    const D = 3.4;
    const inRoom = v => v.x > -6.35 && v.x < 6.35 && v.z > -6.35 && v.z < 6.35;
    let want = base.clone().add(side.clone().multiplyScalar(D));
    if (!inRoom(want)) want = base.clone().add(side.clone().multiplyScalar(-D));
    if (!inRoom(want)) {
      want.x = Math.max(-6.3, Math.min(6.3, want.x));
      want.z = Math.max(-6.3, Math.min(6.3, want.z));
    }
    want.y = base.y + 1.85;
    camera.position.lerp(want, 0.18);
    controls.target.lerp(base.clone().add(new THREE.Vector3(0, 0.95, 0)), 0.2);
  } else if (freeCam) {
    /* 自由视角：不干预相机 */
  } else if (camSnap && camAuto) {
    camera.position.set(camGoal.pos[0], camGoal.pos[1], camGoal.pos[2]);
    controls.target.set(camGoal.target[0], camGoal.target[1], camGoal.target[2]);
    camBlend = 1; camSnap = false;
  } else if (camAuto && !TOPVIEW) {
    camBlend = Math.min(1, camBlend + 0.015);
    const e = camBlend * camBlend * (3 - 2 * camBlend);
    camera.position.lerp(new THREE.Vector3(camGoal.pos[0], camGoal.pos[1], camGoal.pos[2]), 0.02 * e);
    controls.target.lerp(new THREE.Vector3(camGoal.target[0], camGoal.target[1], camGoal.target[2]), 0.024 * e);
  }

  updateCats(_dt);

  if (mixer) {
    mixer.update(Math.min(0.05, (now - (tick._last || now)) / 1000));
    tick._last = now;
  }
  const t = (now - t0) / 1000;
  driveVRM(t);
  if (cur.rotX > -0.5) torso.rotation.z = Math.sin(t * 1.2) * 0.012;
  if (!modelRoot) girl.position.y = cur.root.y + Math.sin(t * 1.35) * 0.006;
  shade.material.emissiveIntensity = 1.05 + Math.sin(t * 2.2) * 0.05;
  screenLight.intensity = 1.5 + Math.sin(t * 5.1) * 0.12;
  if (glbTvScreen) {
    const on = (typeof tvOn !== 'undefined' && tvOn);
    glbTvScreen.material.emissive.setHex(on ? 0x2f83b8 : 0x000000);
    glbTvScreen.material.emissiveIntensity = on ? (0.85 + Math.sin(t * 5.1) * 0.06) : 0;
  }
  if (typeof tvGlowLight !== 'undefined') {
    const on = (typeof tvOn !== 'undefined' && tvOn) ? 1 : 0;
    tvGlowLight.intensity += ((on ? 2.2 + Math.sin(t * 7) * 0.25 : 0) - tvGlowLight.intensity) * 0.08;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

window.addEventListener('resize', resize);
resize();
loadRoomShell().then(() => loadVRM()).then(ok1 => {
  if (ok1) { girl.visible = false; contact.visible = false; return true; }
  return loadCharacter().then(ok2 => {
    if (ok2) { girl.visible = false; contact.visible = false; }
    return ok2;
  });
});
requestAnimationFrame(tick);
document.getElementById('loading').style.display = 'none';
</script>
